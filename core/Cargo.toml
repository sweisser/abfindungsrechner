[package]
name = "abfindung_core"
version = "0.1.0"
edition = "2021"

[lib]
crate-type = ["cdylib", "rlib"]

[dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
# Must match the installed wasm-bindgen CLI exactly (see justfile).
wasm-bindgen = "=0.2.129"
# Writes the Excel export. `wasm`: timestamps via js-sys (std::time panics on wasm32).
rust_xlsxwriter = { version = "0.99.1", default-features = false, features = ["wasm"] }

[dev-dependencies]
# Reads the exported xlsx back in tests.
zip = { version = "8", default-features = false, features = ["deflate"] }

[profile.release]
opt-level = "s"
lto = true
strip = true
